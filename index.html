<script>

function openForm(kind,id,isOpt){const meta=(isOpt?OPT:REC)[kind],r=(id&&T(kind).find(x=>x.id==id))||{};
 const h=meta[1].map(([k,l,ty,ref])=>{let v=r[k]??(ty=='date'?TD():ty=='month'?selM():''),i;
  if(ty=='sel')i=`<select data-k="${k}">${selOpts(ref,v)}</select>`;
  else if(ty=='cust')i=`<input data-k="${k}" list="cl" value="${esc(nm('customers',v))}" placeholder="Pick existing or type new"><datalist id="cl">${A('customers').filter(c=>c.active!==false).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`;

  else i=`<input data-k="${k}" type="${ty}" ${ty=='number'?'step="0.01"':''} value="${esc(v)}">`;return `<label>${l}${i}</label>`}).join('');
 modal(`<h3>${id?'Edit':'Add'} ${meta[0].toLowerCase()}</h3><div class="fg">${h}</div><div class="row"><button class="btn" onclick="saveForm('${kind}','${id||''}',${!!isOpt})">Save</button><button class="btn g" onclick="closeM()">Cancel</button></div>`)}

 if((isOpt||['debts','goals','recurring'].includes(kind))&&!o.name)return alert('Name is required');
 if(['sales','expenses','income'].includes(kind)&&(!o.date||!o.amount))return alert('Date and a non-zero amount are required');

 if(kind=='sales'&&o.txid&&T('sales').some(s=>!s.deleted&&s.txid==o.txid&&s.id!=id)&&!confirm('This Transaction ID already exists (possible duplicate). Save anyway?'))return;
 const r=id&&T(kind).find(x=>x.id==id);if(r)Object.assign(r,o,{updated:now()});else T(kind).push({id:uid(kind.slice(0,3)),active:true,...o,created:now(),updated:now()});
 save();closeM();render()}
const del=(k,id)=>{if(confirm('Delete this record? It is soft-deleted and hidden from totals.')){const r=T(k).find(x=>x.id==id);r.deleted=true;r.updated=now();save();render()}};
const tog=(k,id)=>{const r=T(k).find(x=>x.id==id);r.active=r.active===false;r.updated=now();save();render()};
const PAL=['#1e8e4e','#8fc9a0','#2f6f4f','#c9a227','#5aa9a0','#b5d99c','#7a9e87','#d98e4a','#a3b8ab','#3c8d82'];
const card=(t,b,c='')=>`<div class="card ${c}"><h4>${t}</h4>${b}</div>`,E=m=>`<div class="empty">${m||'No data yet. This chart fills in as you add records.'}</div>`;
const rid=()=>'c'+Math.random().toString(36).slice(2,8);
function mk(id,cfg){const c=document.getElementById(id);if(c&&window.Chart)charts.push(new Chart(c,cfg))}
function grp(rows,key,tbl,fb='Unassigned'){const m={};rows.forEach(r=>{const k=r[key]||'';(m[k]=m[k]||{k,name:k?nm(tbl,k)||'(removed)':fb,rows:[],amt:0}).rows.push(r);m[k].amt+=+r.amount||0});return Object.values(m).sort((a,b)=>b.amt-a.amt)}
function donut(t,g){const tot=sum(g,x=>x.amt);if(!tot)return card(t,E());const id=rid();
 post.push(()=>mk(id,{type:'doughnut',data:{labels:g.map(x=>`${x.name}: ${$$(x.amt)} (${(x.amt/tot*100).toFixed(1)}%)`),datasets:[{data:g.map(x=>x.amt),backgroundColor:g.map((_,i)=>PAL[i%10]),borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>c.label}}},onClick:(e,el)=>el.length&&showRows(g[el[0].index])}}));
 return card(t+' <small>(click a segment for records)</small>',`<div class="cv"><canvas id="${id}"></canvas></div>`)}
function showRows(g){modal(`<h3>${esc(g.name)} · ${$$(g.amt)}</h3><div class="tw"><table><tr><th>Date</th><th>Amount</th><th>Reference</th></tr>${g.rows.map(r=>`<tr><td>${r.date||''}</td><td>${$$(r.amount)}</td><td>${esc(r.txid||r.desc||r.notes||'')}</td></tr>`).join('')}</table></div><div class="row"><button class="btn g" onclick="closeM()">Close</button></div>`)}
function chart(t,type,labels,sets,stk){if(!labels.length||!sets.some(s=>s.data.some(v=>v)))return card(t,E());const id=rid();
 post.push(()=>mk(id,{type,data:{labels,datasets:sets.map((s,i)=>({label:s.label,data:s.data,backgroundColor:PAL[i%10],borderColor:PAL[i%10],tension:.3,borderRadius:type=='bar'?4:0}))},options:{maintainAspectRatio:false,scales:{x:{stacked:!!stk,grid:{display:false}},y:{stacked:!!stk,ticks:{callback:v=>'$'+v}}},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${$$(c.raw)}`}}}}}));

function ring(t,pct,sub,bad){if(pct==null)return card(t,E('Not enough data'));const id=rid(),p=Math.max(0,Math.min(100,pct)),c=bad?(pct>=100?'#c4493a':pct>=th().w?'#c58b1a':'#1e8e4e'):'#1e8e4e';

const keys=(rows,g)=>[...new Set(rows.map(r=>bk(r.date,g)))].sort();
const bsum=(rows,k,g)=>sum(rows.filter(r=>bk(r.date,g)==k));
const kpi=(l,v)=>`<div class="k"><small>${l}</small><b>${v}</b></div>`;

function overview(){const s=R('sales'),ex=R('expenses'),inc=R('income'),cf=sum(s.filter(isConf)),tot=sum(s),I=sum(inc),X=sum(ex),m=selM();

 return `<h2>Financial Overview</h2>${emptyHint()}<div class="kp">${kpi('Total sales',$$(tot))}${kpi('Confirmed revenue',$$(cf))}${kpi('Unverified payments',$$(tot-cf))}${kpi('Total income',$$(I))}${kpi('Total expenses',$$(X))}${kpi('Net',$$(I-X))}${kpi('Outstanding debt',$$(sum(db,d=>d.left)))}${kpi('Savings',$$(sum(gl,g=>g.saved)))}</div>
<div class="g2">${ring('Budget utilization ('+m+')',plan?act/plan*100:null,`${$$(act)} of ${$$(plan)}`,1)}${ring('Savings goal progress',sum(gl,g=>g.target)?sum(gl,g=>g.saved)/sum(gl,g=>g.target)*100:null,`${$$(sum(gl,g=>g.saved))} of ${$$(sum(gl,g=>g.target))}`)}${ring('Debt repayment progress',sum(db,d=>d.original)?(1-sum(db,d=>d.left)/sum(db,d=>d.original))*100:null,`${$$(sum(db,d=>d.original)-sum(db,d=>d.left))} repaid`)}${ring('Monthly sales target ('+m+')',tg?mc/tg*100:null,`${$$(mc)} of ${$$(tg)}`)}</div>
<div class="g2">${donut('Expenses by category',eg)}${donut('Income by source',grp(inc,'cat','inccats','Uncategorized'))}${donut('Sales by platform',grp(s,'platform','platforms','No platform'))}${donut('Sales by employee',grp(s,'emp','team'))}${donut('Payment verification status',grp(s,'status','statuses','No status'))}${donut('Payment methods',grp(s,'method','methods','No method'))}</div>
<div class="row"><b>Revenue trend</b><div class="seg">${['day','week','month'].map(g=>`<a class="${g==gran?'on':''}" onclick="gran='${g}';render()">${g}</a>`).join('')}</div></div>
<div class="g2">${chart('Revenue ('+gran+'ly)','line',gk,[{label:'Total',data:gk.map(k=>bsum(s,k,gran))},{label:'Confirmed',data:gk.map(k=>bsum(s.filter(isConf),k,gran))}])}${chart('Income vs expenses','line',mths,[{label:'Income',data:mths.map(k=>bsum(inc,k,'month'))},{label:'Expenses',data:mths.map(k=>bsum(ex,k,'month'))}])}

function dstat(r){if(r.done)return['Paid','ok'];if(!r.due)return['—',''];const d=(new Date(r.due)-new Date(TD()))/864e5;return d<0?['Overdue','e']:d<=7?['Due soon','w']:['Upcoming','']}
function dcalc(r){const L=+r.left,P=+r.min,i=(+r.rate||0)/1200;if(L<=0)return{t:'Paid off',i:0};if(!P)return{t:'Set min. payment',i:0};let n;if(!i)n=L/P;else{if(P<=L*i)return{t:'Payment below interest',i:0};n=-Math.log(1-i*L/P)/Math.log(1+i)}n=Math.ceil(n);const d=new Date();d.setMonth(d.getMonth()+n);return{t:d.toISOString().slice(0,7),i:Math.max(0,P*n-L)}}
